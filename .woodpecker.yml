when:
  - event: push
    branch: main

steps:
  - name: build
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t personal-site:latest .

  - name: deploy
    image: docker:27
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/infra:/srv/infra
    commands:
      - docker compose -f /srv/infra/compose/fontidev/docker-compose.yml up -d --no-deps --force-recreate personal-site
